name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Show independently comparable build digest
        id: integrity
        run: node scripts/print-integrity-digest.mjs
      - name: Verify the README digest embed is current
        run: git diff --exit-code -- docs/build-digest.svg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.integrity.outputs.artifact_name }}
          path: dist/integrity-manifest.json
          if-no-files-found: error
